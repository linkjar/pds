  <line x1="75.5035" y1="280" x2="389.118" y2="280" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="232.31074999999998" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GET /oauth/authorize?request_uri</text>
</g>
<g class="message" data-from="UI" data-to="Acc" data-label="sign-in (password) or remembered device account" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="389.118" y1="320" x2="570.1424999999999" y2="320" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="479.63024999999993" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">sign-in (password) or remembered device account</text>
</g>
<g class="message" data-from="Acc" data-to="UI" data-label="account, consent decision" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="570.1424999999999" y1="360" x2="389.118" y2="360" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="479.63024999999993" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">account, consent decision</text>
</g>
<g class="message" data-from="UI" data-to="App" data-label="redirect with code and iss" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="389.118" y1="400" x2="75.5035" y2="400" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="232.31074999999998" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">redirect with code and iss</text>
</g>
<g class="message" data-from="App" data-to="AS" data-label="POST /oauth/token (code, PKCE verifier, DPoP proof)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="75.5035" y1="440" x2="215.5035" y2="440" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="145.5035" y="430" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">POST /oauth/token (code, PKCE verifier, DPoP proof)</text>
</g>
<g class="message" data-from="AS" data-to="App" data-label="access token (HS256, cnf.jkt), refresh token, scope, sub" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="215.5035" y1="480" x2="75.5035" y2="480" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="145.5035" y="470" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">access token (HS256, cnf.jkt), refresh token, scope, sub</text>
</g>
<g class="message" data-from="App" data-to="RS" data-label="XRPC with DPoP-bound token" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="75.5035" y1="520" x2="730.7895" y2="520" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="403.1465" y="510" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">XRPC with DPoP-bound token</text>
</g>
<g class="message" data-from="RS" data-to="RS" data-label="verify signature, jkt, nonce, scope and permissions" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="730.7895,560 760.7895,560 760.7895,580 730.7895,580" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="768.7895" y="570" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">verify signature, jkt, nonce, scope and permissions</text>
</g>
<g class="actor" data-id="App" data-label="Client app" data-type="participant">
