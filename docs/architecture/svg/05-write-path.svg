<line class="lifeline" data-actor="F" x1="1090.452" y1="70" x2="1090.452" y2="720" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="C" data-to="X" data-label="POST /xrpc/com.atproto.repo.createRecord" data-line-style="solid" data-arrow-head="filled" data-self="false">
