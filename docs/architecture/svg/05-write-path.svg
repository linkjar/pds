  <text x="776.3322499999999" y="470" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">append #commit (seq, ops, blocks, since, rev, prevData)</text>
</g>
<g class="message" data-from="Q" data-to="S" data-label="durable in the same step" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="921.654" y1="520" x2="631.0105" y2="520" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="776.3322499999999" y="510" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">durable in the same step</text>
</g>
<g class="message" data-from="S" data-to="X" data-label="commit (cid, rev)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="631.0105" y1="560" x2="210" y2="560" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
