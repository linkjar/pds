# cargo-deny policy for LinkJar PDS. See docs/SPEC.md section 14.5.
# Every `ignore` entry needs a reason and an expiry date in its comment.

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
]
# MPL-2.0 is file-scoped copyleft and acceptable for dependencies; it is not
# used for the project's own code.

# The Mozilla root certificate list, as data. reqwest's rustls verifier
# depends on it on every platform; on Linux the server verifies against the
# system store and SSL_CERT_FILE. The licence is permissive and is allowed
# for this crate only.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# The same list, as ureq's rustls verifier uses it. ureq is the HTTP client
# of Topcoat's build step (the Tailwind download, pinned by hash) and of
# its asset bundler; the console serves nothing with it.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "openssl-sys", reason = "use rustls; no C TLS stack" },
  { crate = "openssl", reason = "use rustls; no C TLS stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
