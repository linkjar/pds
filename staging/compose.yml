name: linkjar-pds-staging
services:
  pds:
    image: ${PDS_IMAGE:?Set the verified GHCR image digest in staging/image.env}
    restart: unless-stopped
    env_file: ${PDS_ENV_FILE:?Set the absolute path of the staging secrets env file}
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ${PDS_DATA_PATH:?Set the prepared persistent data directory}:/app/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/xrpc/_health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
