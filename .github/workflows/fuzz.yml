name: Fuzz

# Scheduled fuzzing of every parser of untrusted bytes (docs/SPEC.md 14.5).
# Targets live in fuzz/fuzz_targets; each runs for a bounded time.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - syntax_handle
          - syntax_nsid
          - syntax_did
          - syntax_aturi
          - syntax_datetime
          - syntax_tid
          - data_json
          - data_cbor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz@0.13.1
      # The prebuilt cargo-fuzz is a musl binary and builds for its own
      # triple unless told otherwise; the sanitizers need the gnu target.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
