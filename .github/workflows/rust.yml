name: Rust

# Gates for the LinkJar PDS workspace. See docs/SPEC.md section 14.5.
# Actions are pinned by commit SHA; the comment names the release.

on:
  pull_request:
    paths-ignore: ['parity/**']
  push:
    branches: [main]
    paths-ignore: ['parity/**']
  schedule:
    # Mondays. The toolchain follows stable and advisories arrive without
    # a push, so a quiet week is checked here and not on the next pull
    # request. This is also what runs the advisories job.
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, codegen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The tests of the shared tier on Postgres (SPEC §21.2) run when
    # PDS_TEST_POSTGRES_URL names a server. The password is for this
    # container, which lives as long as the job.
    services:
      postgres:
        image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # 18-alpine
        env:
          POSTGRES_USER: pds
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: pds
        ports:
          - 127.0.0.1:54329:5432
        options: >-
          --health-cmd "pg_isready -U pds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PDS_TEST_POSTGRES_URL: postgres://pds:test-password@127.0.0.1:54329/pds
      # The official MCP client and the Inspector against the MCP server
      # (the gate of unit 10). Both come from the lockfile of parity/.
      PDS_TEST_MCP_CLIENT: node
      MCP_INSPECTOR: ${{ github.workspace }}/parity/node_modules/.bin/mcp-inspector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by SHA, the action cannot take the channel from its ref.
      # rustup then applies rust-toolchain.toml to every cargo call.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `sqlite-plugin`, which the simulation uses, generates its bindings
      # with bindgen. The runner image has no libclang.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libclang-dev
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: parity/.node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
        working-directory: parity
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generated types are current
        run: cargo xtask codegen --check
      # The workspace excludes fuzz/, so no step above compiles the targets.
      # A check needs neither nightly nor cargo-fuzz.
      - name: Fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

  supply-chain:
    name: deny, vet, lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Lockfile matches manifests
        run: cargo metadata --locked --format-version 1 > /dev/null
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-vet@0.10.1
      - run: cargo vet --locked

  audit:
    name: advisories (scheduled)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # 0.21 cannot read an advisory that carries a CVSS 4.0 score and
          # then fails before it looks at the lockfile.
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings
