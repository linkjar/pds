name: Check upstream PDS releases

# A weekly report of the stable upstream releases newer than the pin in
# upstream.json, kept in one issue. The pin is the compatibility baseline of
# the server (docs/SPEC.md section 2.1); nothing here changes it.
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-upstream.py --report "$RUNNER_TEMP/upstream.md"
      # One issue is kept current, not one opened per run. The script writes
      # no report when the pin is current, and the step then closes the issue.
      - name: Report releases newer than the pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Upstream PDS releases newer than the pin
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/upstream.md"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == env.TITLE))[0].number // empty")"
          if [ ! -s "$report" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment 'The pin is current.'
            fi
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$report"
          fi
