name: Site

# Astro Starlight documentation, hosted on Cloudflare Workers at pds.linkjar.io.
# This workflow validates the site and saves an artifact; it does not publish.
# Actions are pinned by commit SHA.

on:
  pull_request:
    paths: ['site/**', 'docs/architecture/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'docs/architecture/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The "last updated" dates come from the git history.
          fetch-depth: 0
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 24
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --dir ../docs/architecture install --frozen-lockfile
      - run: pnpm --dir ../docs/architecture check
      - run: pnpm build
      - run: pnpm test:built
      - run: pnpm deploy:dry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pds-docs
          path: site/dist
          if-no-files-found: error
          retention-days: 14
