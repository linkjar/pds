name: Parity harness

# The parity harness (parity/, docs/SPEC.md section 17) against the reference
# image. It checks the normaliser on two boots of the Reference and holds the
# Reference to the upstream distribution with the recorded differences. No
# job here runs the Candidate: restore.yml holds the Candidate to the
# Reference.
#
# Actions are pinned by commit SHA. The runner is amd64 because the relay
# image is published for amd64 only.
#
# Each target has its own stack, so the three run side by side and a last job
# compares their transcripts. A change that touches only Markdown under
# parity/ does not start the stacks.

on:
  pull_request:
    paths: ['parity/**', '!parity/**/*.md', 'upstream.json', '.github/workflows/parity.yml']
  push:
    branches: [main]
    paths: ['parity/**', '!parity/**/*.md', 'upstream.json', '.github/workflows/parity.yml']
  schedule:
    # Mondays, after the upstream updater.
    - cron: '47 9 * * 1'
  workflow_dispatch:
    inputs:
      perf:
        description: Also run the performance scenarios (SPEC 16.1) at full scale
        type: boolean
        default: false

permissions:
  contents: read
  # The reference image is a private package of this repository.
  packages: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: parity

jobs:
  check:
    name: typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: parity/.node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  parity:
    name: scenarios (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `repeat` is a second boot of the Reference.
        target: [reference, repeat, official]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: parity/.node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The pinned Reference is the image upstream.json describes
        if: matrix.target == 'reference'
        run: pnpm parity images verify
      - name: Scenarios, every profile
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for profile in default invites firehose captcha; do
            pnpm parity run "$TARGET" --profile "$profile"
          done
      - name: Keep transcripts and service logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios-${{ matrix.target }}
          # Both paths are named so that the artifact is rooted at the
          # target's run directory whether or not there are logs.
          path: |
            parity/.run/${{ matrix.target }}/transcripts
            parity/.run/${{ matrix.target }}/logs
          if-no-files-found: ignore
          retention-days: 14

  compare:
    name: comparisons
    needs: parity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: parity/.node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scenarios-*
          path: parity/.run
      - name: Put each target's transcripts where the harness reads them
        run: |
          set -euo pipefail
          for target in reference repeat official; do
            mv ".run/scenarios-$target" ".run/$target"
            test -d ".run/$target/transcripts/default"
          done
      - name: Two boots of the Reference show no difference
        run: pnpm parity compare reference repeat
      - name: Reference against the official distribution shows the recorded differences
        run: pnpm parity compare reference official

  perf:
    name: performance baseline (SPEC 16.1)
    if: github.event_name == 'schedule' || inputs.perf
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version-file: parity/.node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm parity run reference --profile perf
      - run: pnpm parity perf report reference >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parity-perf
          path: |
            parity/.run/reference/perf
            parity/results
          if-no-files-found: ignore
          retention-days: 90
