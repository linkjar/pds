name: Native packages

on:
  pull_request:
    paths: ['flake.*', 'nix/**', 'crates/**', 'lexicons/**', 'xtask/**', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/nix.yml']
  push:
    branches: [main]
    paths: ['flake.*', 'nix/**', 'crates/**', 'lexicons/**', 'xtask/**', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/nix.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Evaluate all supported platforms
        run: nix flake check --all-systems --no-build
      - name: Build and smoke-test the native Nix package
        run: |
          nix build .#linkjar-pds --print-build-logs
          python3 nix/tests/native-smoke.py result/bin/linkjar-pds
      - name: Build and smoke-test the portable Linux executable
        run: |
          nix build .#linkjar-pds-static --out-link result-static --print-build-logs
          mkdir -p dist-native/package
          cp result-static/bin/linkjar-pds dist-native/package/linkjar-pds
          python3 - <<'PY'
          import subprocess
          result = subprocess.check_output(['readelf', '--program-headers', 'dist-native/package/linkjar-pds'], text=True)
          assert 'INTERP' not in result, 'The portable executable needs a dynamic loader'
          dynamic = subprocess.check_output(['readelf', '--dynamic', 'dist-native/package/linkjar-pds'], text=True)
          assert '(NEEDED)' not in dynamic, 'The portable executable needs shared libraries'
          PY
          python3 nix/tests/native-smoke.py dist-native/package/linkjar-pds
          cp LICENSE dist-native/package/
          tar -czf "dist-native/linkjar-pds-${{ matrix.system }}.tar.gz" -C dist-native/package .
          cd dist-native
          sha256sum "linkjar-pds-${{ matrix.system }}.tar.gz" > "linkjar-pds-${{ matrix.system }}.tar.gz.sha256"
      - name: Test the NixOS service, persistence, and closed firewall
        if: matrix.system == 'x86_64-linux'
        run: nix build .#checks.x86_64-linux.nixos-service --no-link --print-build-logs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkjar-pds-${{ matrix.system }}
          path: |
            dist-native/*.tar.gz
            dist-native/*.sha256
          if-no-files-found: error
          retention-days: 14
