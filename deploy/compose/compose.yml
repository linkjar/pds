# LinkJar PDS on one host: the server behind Caddy, which obtains a
# certificate for the server's name and for each hosted handle on demand.
# The guide is pds.linkjar.io (site/); docs/runbooks/test-host.md uses the
# same files for a test host. LinkJar's own hosts are deployed from
# linkjar/infra.
name: linkjar-pds
services:
  pds:
    # By digest, from the summary of the "Server images" workflow on main.
    image: ${PDS_IMAGE:?Set PDS_IMAGE in .env to ghcr.io/linkjar/pds-server@sha256:...}
    restart: unless-stopped
    environment:
      PDS_HOSTNAME: ${PDS_HOSTNAME:?Set PDS_HOSTNAME in .env}
    env_file:
      # Raw, so that a secret may hold a dollar sign.
      - path: ./pds.env
        format: raw
    volumes:
      # Owned by uid 1000, the server's user in the image.
      - ${PDS_DATA_PATH:-./data}:/app/data
    expose:
      - "3000"
    # The server finishes its writes and closes the firehose on SIGTERM.
    stop_grace_period: 60s

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      pds:
        condition: service_healthy
    environment:
      PDS_HOSTNAME: ${PDS_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
