[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
# cargo-fuzz builds fuzz/ on nightly with its own lockfile. bench/ holds the
# D2 comparison with rsky-repo, whose dependencies stay out of this lockfile.
exclude = ["fuzz", "bench"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/linkjar/pds"
homepage = "https://github.com/linkjar/pds"
authors = ["LinkJar"]
publish = false

[workspace.dependencies]
# workspace crates
pds-types = { path = "crates/pds-types" }
pds-lexicon = { path = "crates/pds-lexicon" }
pds-repo = { path = "crates/pds-repo" }
pds-storage = { path = "crates/pds-storage" }
pds-blob = { path = "crates/pds-blob" }
pds-identity = { path = "crates/pds-identity" }
pds-xrpc = { path = "crates/pds-xrpc" }
pds-sequencer = { path = "crates/pds-sequencer" }
pds-account = { path = "crates/pds-account" }
pds-oauth = { path = "crates/pds-oauth" }
pds-audit = { path = "crates/pds-audit" }
pds-ext = { path = "crates/pds-ext" }
pds-ext-linkjar = { path = "crates/pds-ext-linkjar" }
pds-sim = { path = "crates/pds-sim" }

# serialization and data model
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_ipld_dagcbor = "0.7"
ipld-core = { version = "0.4", features = ["serde"] }
cid = { version = "0.11", features = ["serde", "std"] }
sha2 = "0.11"
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
multibase = "0.9"
zeroize = "1"
data-encoding = "2"
base64 = "0.22"

# storage, HTTP and runtime
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
bytes = "1"
url = "2"
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
hmac = "0.13"
subtle = "2"
scrypt = { version = "0.12", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
socket2 = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }

# syntax and time
regex = "1"
ring = "0.17"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.9"
thiserror = "2"
unicode-segmentation = "1"

# dev
# The simulation only: its build needs libclang.
sqlite-plugin = "0.11"
# The simulation only: the network.
turmoil = "0.7"
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
anyhow = "1"
heck = "0.5"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

# CI runs with -D warnings, so every "warn" below is a hard failure there.
# Panic lints are allowed in tests through clippy.toml.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
use_self = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

# The password hash is slow by design; without optimisation one check
# takes two seconds in a test.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1
