
# cargo-vet audits file

[[audits.crypto-bigint]]
who = "AI agent (no human certification)"
criteria = "safe-to-deploy"
delta = "0.7.5 -> 0.7.10"
notes = """
Automated source-delta review on 2026-10-28, against the existing 0.7.5
bootstrap exemption. This does not claim a full audit of the base version.
Reviewed the published-crate diff, changelog and RUSTSEC-2026-0387 (0.7.5 is
yanked; 0.7.6 to 0.7.8 are yanked for the NonZero Mul API break in #1373).
Downloaded archive SHA-256 matches both workspace and fuzz lockfiles:
9c035cb64cba03dad2fb921f3e218785e8cf9a41790da5eb3a1400f62fa2be11.
The package identifies upstream commit 55af01b1957b1f90d718bf697ea9a6db7287151c.

The changes remove secret-dependent timing: Choice-to-mask conversion no longer
uses to_u8_vartime, wide-word equality and non-zero checks go through ctutils
comparison primitives, borrowing_sub, CTZ, div_rem, nlimbs and Montgomery
multiplication drop data-dependent branches, BoxedMontyForm::invert no longer
branches on invertibility, and UintRef equality is constant-time. Correctness
fixes cover Montgomery reduction in repeated squaring, invert_odd_mod
truncation, mul_mod_special boundaries, exact division and GCD edge cases.
Remaining to_bool() branches are on public values (sign for Display, Jacobi
symbol, odd-modulus preconditions) or gated on the VARTIME const parameter.
Constant-time verification is supplied upstream (cargo checkct); this review
does not independently prove constant-time behavior on every target.

No unsafe block, build script, I/O, process or network access was added.
Runtime dependencies are unchanged apart from ctutils moving to 0.4.6; the
num-bigint and num-modular bumps are dev-dependencies. MSRV rises to 1.87.
This review supports this exact delta only.
"""

[[audits.ctutils]]
who = "Codex (AI agent; no human certification)"
criteria = "safe-to-deploy"
delta = "0.4.3 -> 0.4.4"
notes = """
Automated source-delta review on 2026-10-23, against the existing 0.4.3
bootstrap exemption. This does not claim a full audit of the base version.
Reviewed the published-crate diff and RUSTSEC-2026-0385. Downloaded archive
SHA-256 matches both workspace and fuzz lockfiles:
12218662ccac37d9714f2191252553d67585b97df8c839cbe49e0bde278dc865.
The package identifies upstream commit a993c0ba50db6510d8db15a6219572de65115438.

Mask generation now uses Choice::to_u8(), which applies the existing
optimization barrier, before wrapping negation. On 32-bit targets, u128
comparison combines opaque high-half and low-half predicates instead of a
full-width subtraction. CtLt/CtGt delegate to that implementation. Reviewed
the added boundary and randomized comparison tests. Constant-time machine-code
verification is supplied upstream; this review does not independently prove
constant-time behavior on every supported target.

No runtime dependency, feature, build script, unsafe block, I/O, or allocation
was added. Other changes affect package metadata, changelog, tests, and the
crate's development lockfile. This review supports this exact patch delta.
"""

[[audits.ctutils]]
who = "AI agent (no human certification)"
criteria = "safe-to-deploy"
delta = "0.4.4 -> 0.4.6"
notes = """
Automated source-delta review on 2026-10-28, chained on the 0.4.3 -> 0.4.4
review above. Downloaded archive SHA-256 matches both lockfiles:
fe3e9d21d39e6f39ff46e03d5b621424f88ee23d8a1672c6bfc9ccc7f2da4f6a.
The package identifies upstream commit 79275f704220fe32574c2a61973af40e4e1925b2.

The bitle/bitlt/bitnz macros move unchanged into a new public primitives
module, with bitlt expressed through a shared bitborrow formula. New
borrowing_sub_u32/u64 and _mask variants compute the borrow-out with that
formula behind core::hint::black_box. On Thumb-1 (arm without pointer-width
atomics), comparisons pass through black_box and are kept out of line, and
Choice AND composes through to_u8() so the optimizer cannot branch on it.
Reviewed the added primitive and proptest comparison tests.

No dependency, feature, build script, unsafe block, I/O, or allocation was
added. This review supports this exact delta only.
"""

[[audits.rustls-webpki]]
who = "Codex (AI agent; no human certification)"
criteria = "safe-to-deploy"
delta = "0.103.15 -> 0.103.16"
notes = """
Automated source-delta review on 2026-10-21, against the existing 0.103.15
bootstrap exemption. This does not claim a full audit of the base version.
Reviewed the complete published-crate diff, RUSTSEC-2026-0382, and
https://github.com/rustls/webpki/pull/546. The downloaded crate SHA-256 matches
Cargo.lock. All changed runtime source and eight SPKI data files match upstream
release commit 8ecdcc76f56b68fda67a6adf7976f5eed5006a4c byte-for-byte.

The production change adds a fixed denylist to certificate path construction.
It checks the leaf and each intermediate before path expansion, and checks
trust-anchor keys before accepting a path. The compared SPKI representation
matches the existing certificate and trust-anchor parsers. Existing signature,
time, name, usage, and revocation checks remain. The new error retains normal
alternative-path search. Reviewed upstream regression cases for leaf, root,
intermediate, unrelated certificates, and cross-signing; these upstream unit
tests were inspected, not executed as part of this delta review.

No new dependency, feature, build script, unsafe block, I/O, or unbounded work
was added. Other published changes are version/commit metadata and the package's
own lockfile version. This review supports this exact patch delta only.
"""

[[audits.tokio]]
who = "Codex (AI agent; no human certification)"
criteria = "safe-to-deploy"
delta = "1.53.2 -> 1.53.3"
notes = """
Automated source-delta review on 2026-10-23, against the existing 1.53.2
bootstrap exemption. This does not claim a full audit of the base version.
Reviewed the runtime source and manifest changes, release notes, and
RUSTSEC-2026-0386. Downloaded archive SHA-256 matches both lockfiles:
ce3335fa71841cda333a58d7615b03901380ecf09d59b3296d21f8bbac0dde4e.
The package identifies upstream commit a85c3f5baa298a6b554fd3700daf0342289881af.

AsyncFd registration gains unsafe constructors with explicit descriptor lifetime
and identity requirements. The old safe constructors remain deprecated for
compatibility; consumers must uphold those requirements when using them. No
first-party workspace code uses AsyncFd. The AsFd implementation documents the
same invariant and registration failures preserve ownership of the inner object.

Other runtime fixes defer DuplexStream and semaphore wake/drop operations until
after releasing locks, preserve I/O resources after an io_uring submission that
may have reached the kernel, and notify the time driver for current-thread
wakes. Reviewed cancellation ownership, optional returned buffers, interrupted
submission retries, bounded wake batches, and readiness/cooperative scheduling.
The join macro changes handle uninhabited output types without changing the
successful output path. An atomic wrapper suppresses a standard-library
deprecation while preserving the existing operation and ordering.

Dependency declarations, features, and the Rust minimum are unchanged. There is
no build script or new external I/O destination. The unstable io_uring path is
not enabled by this workspace. This review supports this exact patch delta;
it does not certify the base runtime or all possible downstream AsyncFd uses.
"""

